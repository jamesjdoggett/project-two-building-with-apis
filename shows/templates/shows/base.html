{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShowVault{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <script src="{% static 'shows/discovery.js' %}" defer></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
  <a href="#main" class="sr-only focus:not-sr-only">Skip to content</a>
  <header class="border-b border-base-300 bg-base-100">
    <nav class="navbar mx-auto max-w-6xl flex-wrap gap-3 px-6" aria-label="Main navigation">
      <a class="text-xl font-bold tracking-tight" href="{% url 'shows:home' %}">ShowVault</a>
      {% if user.is_authenticated %}
        <a class="btn btn-ghost btn-sm" href="{% url 'shows:library' %}">My library</a>
        <a class="btn btn-ghost btn-sm" href="{% url 'shows:discover' %}">Discover shows</a>
        <span class="ml-auto text-sm">{{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}<button class="btn btn-outline btn-sm" type="submit">Sign out</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <main id="main" class="mx-auto max-w-6xl px-6 py-10">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto max-w-6xl px-6 pb-8 text-sm text-base-content/70">
    ShowVault · Your next great watch starts here.
  </footer>
</body>
</html>
